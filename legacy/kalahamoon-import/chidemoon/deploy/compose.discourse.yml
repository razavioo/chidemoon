services:
  chidemoon-discourse:
    image: discourse/discourse:2026.1.5
    container_name: chidemoon-discourse
    restart: unless-stopped
    shm_size: 512m
    environment:
      DISCOURSE_HOSTNAME: community.chidemoon.com
      DISCOURSE_FORCE_HTTPS: "true"
      DISCOURSE_DEFAULT_LOCALE: fa_IR
      DISCOURSE_TITLE: Chidemoon Community
      DISCOURSE_SHORT_SITE_DESCRIPTION: Independent community for home products and interior design
      DISCOURSE_DB_HOST: chidemoon-discourse-db
      DISCOURSE_DB_NAME: discourse
      DISCOURSE_DB_USERNAME: discourse
      DISCOURSE_DB_PASSWORD: ${DISCOURSE_DB_PASSWORD:?Set DISCOURSE_DB_PASSWORD in .env}
      DISCOURSE_REDIS_HOST: chidemoon-discourse-redis
      DISCOURSE_REDIS_PORT: "6379"
      DISCOURSE_DEVELOPER_EMAILS: ${DISCOURSE_ADMIN_EMAIL:?Set DISCOURSE_ADMIN_EMAIL in .env}
      DISCOURSE_SMTP_ADDRESS: ${DISCOURSE_SMTP_ADDRESS:-smtp.resend.com}
      DISCOURSE_SMTP_PORT: ${DISCOURSE_SMTP_RELAY_PORT:-1587}
      DISCOURSE_SMTP_DOMAIN: ${DISCOURSE_SMTP_DOMAIN:?Set DISCOURSE_SMTP_DOMAIN in .env}
      DISCOURSE_SMTP_USER_NAME: ${DISCOURSE_SMTP_USER_NAME:?Set DISCOURSE_SMTP_USER_NAME in .env}
      DISCOURSE_SMTP_PASSWORD: ${DISCOURSE_SMTP_PASSWORD:?Set DISCOURSE_SMTP_PASSWORD in .env}
      DISCOURSE_SMTP_ENABLE_START_TLS: ${DISCOURSE_SMTP_ENABLE_START_TLS:-true}
      DISCOURSE_NOTIFICATION_EMAIL: ${DISCOURSE_NOTIFICATION_EMAIL:?Set DISCOURSE_NOTIFICATION_EMAIL in .env}
      UNICORN_WORKERS: "2"
      UNICORN_SIDEKIQS: "1"
    volumes:
      - chidemoon-discourse-data:/shared
    depends_on:
      chidemoon-discourse-db:
        condition: service_healthy
      chidemoon-discourse-redis:
        condition: service_healthy
    networks:
      - proxy
    extra_hosts:
      - "smtp.resend.com:172.18.0.1"
    stop_grace_period: 90s

  chidemoon-discourse-db:
    image: pgvector/pgvector:pg16
    container_name: chidemoon-discourse-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: discourse
      POSTGRES_USER: discourse
      POSTGRES_PASSWORD: ${DISCOURSE_DB_PASSWORD:?Set DISCOURSE_DB_PASSWORD in .env}
    volumes:
      - chidemoon-discourse-postgres:/var/lib/postgresql/data
    networks:
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discourse -d discourse"]
      interval: 10s
      timeout: 5s
      retries: 12

  chidemoon-discourse-redis:
    image: redis:7-alpine
    container_name: chidemoon-discourse-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - chidemoon-discourse-redis:/data
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

networks:
  proxy:
    external: true

volumes:
  chidemoon-discourse-data:
  chidemoon-discourse-postgres:
  chidemoon-discourse-redis:
